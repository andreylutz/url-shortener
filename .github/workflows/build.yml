name: Проверка проекта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v7
      - name: Настройка JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Сборка, тесты и проверка форматирования
        run: mvn --batch-mode --no-transfer-progress clean verify
